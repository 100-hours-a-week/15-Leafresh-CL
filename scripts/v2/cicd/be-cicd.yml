  #         tags: |
  #           jchanho99/backend-prod:latest
  #         cache-from: type=gha,scope=build-backend-prod
  #         cache-to: type=gha,mode=max,scope=build-backend-prod


  deploy-dev:
    name: BE Docker 배포
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.set-status.outputs.status }}
    steps:
      - uses: actions/checkout@v3              # 소스코드 체크아웃

      - name: Extract tag name
        id: tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Deploy Backend (Develop) via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SHORT_SHA
          script: |
            set -e
            echo "GCP 인증 및 Docker 로그인"
            echo '${{ secrets.GCP_SA_KEY_GCS_BASE64 }}' | base64 -d > ~/leafresh-gcs.json
            sudo mv ~/leafresh-gcs.json /home/ubuntu/backend/app/leafresh-gcs.json
            sudo chown ubuntu:ubuntu /home/ubuntu/backend/app/leafresh-gcs.json
            sudo chmod 600 /home/ubuntu/backend/app/leafresh-gcs.json

            echo "Secret Manager에서 .env 기져오기"
            # .env를 홈 디렉토리에 우선 저장
            if ! gcloud secrets versions access latest \
              --secret="env-be-dev" \
              --project="leafresh-dev2" > ~/env-be-dev.tmp; then
              echo ".env 파일 다운로드 실패"
              exit 1
            fi
            
            # 권한 수정 후 앱 디렉토리로 이동
            sudo mv ~/env-be-dev.tmp /home/ubuntu/backend/app/.env
            sudo chown ubuntu:ubuntu /home/ubuntu/backend/app/.env
            sudo chmod 600 /home/ubuntu/backend/app/.env
            
            echo "[DEV] 환경 배포 중"
            cd /home/ubuntu/backend
            sudo docker compose down --rmi all
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker compose ps
      
      - name: Set Status (Dev)
        id: set-status
        if: success()
        run: echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Set Status (Dev Failure)
        if: failure() && steps.deploy-step.outcome == 'failure' # deploy-step이 실패했을 때만
        run: echo "status=failure" >> "$GITHUB_OUTPUT"

  deploy-prod:
    name: BE Docker 배포 (Prod)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.set-status.outputs.status }}
    steps:
      - name: Checkout for git access
        uses: actions/checkout@v3

      - name: Checkout for git access
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: 'gradle' # Cache Gradle dependencies for faster builds

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID_PROD }}
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy on VM via IAP (using transferred file)
        run: |
          echo "${{ secrets.ENV_BE_PROD }}" > env.docker-prod
          echo '${{ secrets.GCP_SA_KEY_PROD_BASE64 }}' | base64 -d > leafresh-prod3-wren.json
          JAR_FILE=$(find build/libs -name "*.jar" | sort -V | tail -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No JAR file found in build/libs"
            exit 1
          fi
          echo "Found JAR file: $JAR_FILE"
          
          gcloud compute scp --tunnel-through-iap \
            env.docker-prod leafresh-prod3-wren.json "$JAR_FILE"\
            ${{ secrets.SSH_USER }}@leafresh-be-tester-a:/home/${{ secrets.SSH_USER }}/be \
            --project=${{ secrets.GCP_PROJECT_ID_PROD }} \
            --zone=${{ secrets.AZ }}

          gcloud compute ssh ${{ secrets.SH_USER }}@leafresh-be-tester-a \
            --project=${{ secrets.PROJECT_ID }} \
            --zone=${{ secrets.AZ }} \
            --tunnel-through-iap \
            --command="bash -c 'cd be && ./deploy.sh'"

      - name: Set Status (Prod)
        id: set-status
        if: success()
        run: echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Set Status (Prod Failure)
        if: failure() && steps.deploy-step.outcome == 'failure' # deploy-step이 실패했을 때만
        run: echo "status=failure" >> "$GITHUB_OUTPUT"

  notify:
    name: Discord Notification
    needs: [deploy-dev, deploy-prod]
    if: |
      (needs.deploy-dev.result != 'skipped') || (needs.deploy-prod.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Message
        run: |
          MESSAGE=""

          # Check Dev Deploy Status
          if [ "${{ needs.deploy-dev.result }}" != "" ]; then
            STATUS_DEV="${{ needs.deploy-dev.outputs.status }}"
            if [ "$STATUS_DEV" = "success" ]; then
              MESSAGE="${MESSAGE}✅ \`[BE develop]\` 배포 완료\n"
            elif [ "$STATUS_DEV" = "failure" ]; then
              MESSAGE="${MESSAGE}🚨 \`[BE develop]\` 배포 실패\n"
            fi
          fi

          # Check Prod Deploy Status
          if [ "${{ needs.deploy-prod.result }}" != "" ]; then
            STATUS_PROD="${{ needs.deploy-prod.outputs.status }}"
            if [ "$STATUS_PROD" = "success" ]; then
              MESSAGE="${MESSAGE}✅ \`[BE prod]\` 배포 완료 (Blue-Green)\n"
            elif [ "$STATUS_PROD" = "failure" ]; then
              MESSAGE="${MESSAGE}🚨 \`[BE prod]\` 배포 실패 (헬스체크 실패 등)\n"
            fi
          fi

          if [ -z "$MESSAGE" ]; then
            MESSAGE="⚠️ 배포 상태 정보를 찾을 수 없습니다."
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"$MESSAGE\"}" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
