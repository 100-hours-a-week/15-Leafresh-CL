services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-develop
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    command: ["redis-server", "/etc/redis/redis-stack.conf"]
    volumes:
      - redis_data:/data
      - /home/ubuntu/redis.conf:/etc/redis/redis-stack.conf
    networks:
      - internal_network

volumes:
  redis_data:

networks:
  internal_network:
    driver: bridge
