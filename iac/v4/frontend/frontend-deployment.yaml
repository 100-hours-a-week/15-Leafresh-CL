# frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: jchanho99/frontend-develop:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000 
        envFrom:
        - configMapRef:
            name: frontend-env-config
